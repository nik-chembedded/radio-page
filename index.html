<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Listen to Israeli radio stations live: Galgalatz, Galei Zahal, Kan, Eco 99FM, 103FM and more.">
  <meta name="theme-color" content="#1f5fd1">
  <title>Israel Radio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%BB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Israel Radio</h1>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20 15.31 23.31 12 20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69zM12 18V6c3.31 0 6 2.69 6 6s-2.69 6-6 6z"/></svg>
    </button>
  </header>

  <main>
    <section class="player" aria-label="Now playing">
      <div id="nowLogo" class="now-logo" aria-hidden="true">📻</div>
      <div class="now-text">
        <div id="nowName" class="now-name">Pick a station</div>
        <div id="nowStatus" class="now-status" aria-live="polite">&nbsp;</div>
      </div>
      <button id="playBtn" class="play" aria-label="Play" disabled>
        <svg id="playIcon" viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
      <label class="volume">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      </label>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab active" role="tab" id="tabAll" aria-selected="true">All</button>
      <button class="tab" role="tab" id="tabFav" aria-selected="false">Favorites (<span id="favCount">0</span>)</button>
    </div>

    <input id="search" class="search" type="search" placeholder="Search stations" aria-label="Search stations" autocomplete="off">

    <ul id="grid" class="grid"></ul>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer>
    Unofficial listener page. Audio streams are provided by the stations themselves; station names belong to their respective broadcasters.
  </footer>

  <script src="stations.js"></script>
  <script src="app.js"></script>
</body>
</html>
