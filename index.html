<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Listen to Israeli radio stations live: Galgalatz, Galei Zahal, Kan, Eco 99FM, 103FM and more.">
  <meta name="theme-color" content="#0b0f1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Israel Radio">
  <title>Israel Radio</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="topbar">
    <div>
      <h1>Israel Radio</h1>
      <p class="tagline">Listen live to <span id="stationTotal">18</span> Israeli stations</p>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="pill-btn" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
        Install
      </button>

      <div class="menu-wrap">
        <button id="sleepBtn" class="icon-btn sleep-btn" aria-label="Sleep timer" aria-haspopup="true" aria-expanded="false" title="Sleep timer">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.96 8.96 0 0 0 12 4a9 9 0 1 0 9 9c0-2.12-.74-4.07-1.97-5.61zM12 20a7 7 0 1 1 0-14 7 7 0 0 1 0 14z"/></svg>
          <span id="sleepLeft" class="sleep-left" hidden></span>
        </button>
        <div id="sleepMenu" class="menu" role="menu" hidden>
          <div class="menu-title">Sleep timer</div>
          <button class="menu-item" role="menuitem" data-min="15">15 minutes</button>
          <button class="menu-item" role="menuitem" data-min="30">30 minutes</button>
          <button class="menu-item" role="menuitem" data-min="60">1 hour</button>
          <button class="menu-item" role="menuitem" data-min="90">1.5 hours</button>
          <button id="sleepOff" class="menu-item off" role="menuitem" data-min="0" hidden>Turn off timer</button>
        </div>
      </div>

      <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20 15.31 23.31 12 20 8.69V4h-4.69L12 .69 8.69 4H4v4.69L.69 12 4 15.31V20h4.69L12 23.31 15.31 20H20v-4.69zM12 18V6c3.31 0 6 2.69 6 6s-2.69 6-6 6z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="recentSection" class="recent" hidden aria-label="Recently played">
      <h2>Recently played</h2>
      <div id="recentRow" class="recent-row"></div>
    </section>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" id="tabAll" aria-selected="true">All</button>
        <button class="tab" role="tab" id="tabFav" aria-selected="false">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          Favorites <span id="favCount" class="count">0</span>
        </button>
      </div>
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input id="search" class="search" type="search" placeholder="Search stations" aria-label="Search stations" autocomplete="off">
      </label>
    </div>

    <div id="chips" class="chips" role="group" aria-label="Filter by genre"></div>

    <ul id="grid" class="grid"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer>
      Unofficial listener page. Audio streams are provided by the stations themselves; station names belong to their respective broadcasters.
    </footer>
  </main>

  <!-- Sticky mini player -->
  <section class="dock" aria-label="Now playing">
    <div id="nowLogo" class="now-logo" aria-hidden="true">📻</div>
    <div class="now-text">
      <div id="nowName" class="now-name">Pick a station</div>
      <div id="nowStatus" class="now-status" aria-live="polite">Tap a tile to start listening</div>
    </div>

    <div class="vol-wrap">
      <button id="volBtn" class="icon-btn vol-btn" aria-label="Volume" aria-expanded="false">
        <svg id="volIcon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"></svg>
      </button>
      <div id="volPop" class="vol-pop">
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
      </div>
    </div>

    <button id="playBtn" class="play" aria-label="Play" disabled>
      <svg id="playIcon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    </button>
  </section>

  <script src="stations.js"></script>
  <script src="app.js"></script>
</body>
</html>
